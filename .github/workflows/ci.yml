name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart pub publish --dry-run
      # The lowest versions pubspec.yaml allows; test's own dependencies have no working lowest set.
      - run: dart pub downgrade && dart pub upgrade --unlock-transitive test lints
      - run: dart analyze --fatal-infos && dart test --exclude-tags integration

  # The shipped Windows helper must be what its source builds to. When it
  # isn't, the run uploads what it built, and commit-askpass commits it.
  windows-askpass:
    name: windows-askpass (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: mstorsjo/llvm-mingw:20261117@sha256:7b8c46ceb9a469e9fd93678d59294bf3a8e518f1fb5f92555eb1f7bf1bf695d7
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64 }
          - { arch: arm64, target: aarch64 }
    env:
      CC: ${{ matrix.target }}-w64-mingw32-clang
      # No timestamp and no symbols, so a rebuild gives the same bytes.
      FLAGS: -O2 -s -Wl,--no-insert-timestamp
      OUT: windows/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The branch itself, not its merge with the base, since that's where
          # commit-askpass commits.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the helper
        run: $CC $FLAGS -municode -o $OUT/system_ssh_askpass.exe src/askpass_helper.c -lws2_32
      - name: Build the locator
        run: $CC $FLAGS -shared -o $OUT/system_ssh_askpass_locator.dll src/askpass_locator.c
      # Lists any file that differs from, or is missing in, the commit. Windows
      # ignores the executable bit, and an API commit can't set it.
      - name: Check the committed files match
        id: check
        run: |
          # The checkout belongs to another user than the container's.
          git config --global --add safe.directory "$PWD"
          changes=$(git -c core.fileMode=false status --porcelain windows/)
          echo "$changes"
          test -z "$changes"
      - if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-askpass-${{ matrix.arch }}
          path: ${{ env.OUT }}/

  # Commits a rebuilt helper to the PR's branch. GitHub holds the run for that
  # commit until someone approves it on the PR. A fork's PR gets no write
  # token, so its author commits the uploads by hand.
  commit-askpass:
    needs: windows-askpass
    if: >-
      always() && needs.windows-askpass.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-askpass-*
          path: built
      - name: Commit the rebuilt files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          shopt -s nullglob
          additions='[]'
          for file in built/windows-askpass-*/*; do
            arch=$(basename "$(dirname "$file")"); arch=${arch#windows-askpass-}
            base64 -w0 "$file" > "$RUNNER_TEMP/contents"
            additions=$(jq -c --arg path "windows/$arch/$(basename "$file")" \
              --rawfile contents "$RUNNER_TEMP/contents" \
              '. + [{path: $path, contents: $contents}]' <<<"$additions")
          done
          # Uploads only come from a mismatch, not from a failed build.
          [ "$additions" != '[]' ] || exit 0
          # GitHub signs a commit made through its API, as main's rules require.
          jq -n --arg repo "$GH_REPO" --arg branch "$BRANCH" --arg head "$HEAD" \
            --argjson additions "$additions" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "Rebuild the Windows askpass helper"},
                fileChanges: {additions: $additions}
              }}
            }' | gh api graphql --input -

  # The oldest supported SDK on each OS; integration runs the newest.
  unit:
    name: unit (${{ matrix.os }}, 3.10)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # An ARM runner, so the Windows tests run the package's arm64 helper too.
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: '3.10'
      - run: dart pub get
      - run: dart test --exclude-tags integration

  # Real ssh against a real sshd; each image ships its own OpenSSH.
  integration:
    name: integration (${{ matrix.os }})
    needs: [analyze, unit]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, macos-15, macos-26, windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    env:
      SSH_TEST_PORT: 2222
      # Windows wants a mix of cases and digits.
      SSH_TEST_PASSWORD: Correct-Horse-Staple-42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start sshd
        id: sshd
        uses: ./.github/actions/sshd
        with:
          port: ${{ env.SSH_TEST_PORT }}
          password: ${{ env.SSH_TEST_PASSWORD }}
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      - run: ssh -V
      # Git for Windows has an ssh too; the tests must run Windows' own OpenSSH.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: if ((Get-Command ssh).Source -notlike "$env:windir\System32\OpenSSH\*") { throw (Get-Command ssh).Source }
      # The unit job runs the oldest SDK; this is the newest.
      - run: dart test --exclude-tags integration
      # --run-skipped fails loudly if sshd's settings never reached the tests.
      - run: dart test --tags integration --run-skipped
      - name: Show sshd log
        if: failure() && steps.sshd.outputs.log
        shell: bash
        env:
          LOG: ${{ steps.sshd.outputs.log }}
        # On Linux and macOS, root's sshd wrote it.
        run: cat "$LOG" 2>/dev/null || sudo cat "$LOG"

  # The same tests with an ssh the images don't ship: the oldest releases
  # people still run and those newer than any image, against the runner's own
  # sshd. A new release is one more line here.
  openssh:
    name: openssh (${{ matrix.version || matrix.name }})
    needs: [analyze, unit]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built from source on Ubuntu 24.04; the SHA-256 is of the release tarball.
          - { version: 7.6p1, openssl: '1.0', sha256: a323caeeddfe145baaa0db16e98d784b1fbc7dd436a6bf1f479dfd5cd1d21723 }
          - { version: 8.0p1, sha256: bd943879e69498e8031eb6b7f44d08cdc37d59a7ab689aa0b437320c3481fd68 }
          - { version: 8.2p1, sha256: 43925151e6cf6cee1450190c0e9af4dc36b41c12737619edff8bcebdff64e671 }
          - { version: 8.4p1, sha256: 5a01d22e407eb1c05ba8a8f7c654d388a13e9f226e4ed33bd38748dafa1d2b24 }
          - { version: 10.4p1, sha256: ef6026dd2aea8d56059638d5d3262902c892ceba9f88395835e0d06d3fb63238 }
          - { version: 10.5p1, sha256: d44d28a839ea9daf969cc69150fde59910b2b39361dad81a3bd6cbd19218db11 }
          - { version: 10.6p2, sha256: 9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b }
          # Homebrew's, which follows the newest release.
          - { name: Homebrew, os: macos-26 }
          # Microsoft's newest Win32-OpenSSH; the SHA-256 is of OpenSSH-Win64.zip.
          - { name: Win32-OpenSSH 10.4.0.0p1, os: windows-2025, win32: 10.4.0.0p1-Preview, sha256: b67ff8becd203502190ec42ac7787c24c2cd3325ed7700485fe7a1c83d2a7957 }
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    env:
      SSH_TEST_PORT: 2222
      SSH_TEST_PASSWORD: Correct-Horse-Staple-42
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before the ssh under test goes on the PATH, so the sshd's keys come from the runner's own tools.
      - name: Start sshd
        id: sshd
        uses: ./.github/actions/sshd
        with:
          port: ${{ env.SSH_TEST_PORT }}
          password: ${{ env.SSH_TEST_PASSWORD }}
      - if: matrix.version
        uses: ./.github/actions/openssh
        with:
          version: ${{ matrix.version }}
          sha256: ${{ matrix.sha256 }}
          openssl: ${{ matrix.openssl }}
      - if: runner.os == 'macOS'
        run: |
          brew install openssh
          echo "$(brew --prefix openssh)/bin" >> "$GITHUB_PATH"
          echo "SSH_UNDER_TEST=$(brew --prefix openssh)/bin/ssh" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        name: Install Win32-OpenSSH
        shell: pwsh
        env:
          TAG: ${{ matrix.win32 }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "$env:RUNNER_TEMP\OpenSSH-Win64.zip"
          Invoke-WebRequest "https://github.com/PowerShell/Win32-OpenSSH/releases/download/$env:TAG/OpenSSH-Win64.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:SHA256) { throw "OpenSSH-Win64.zip doesn't match its SHA-256" }
          Expand-Archive $zip $env:RUNNER_TEMP
          "$env:RUNNER_TEMP\OpenSSH-Win64" >> $env:GITHUB_PATH
          "SSH_UNDER_TEST=$env:RUNNER_TEMP\OpenSSH-Win64\ssh.exe" >> $env:GITHUB_ENV
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
      - run: dart pub get
      # Fails if the PATH still finds the runner's own ssh. In pwsh, since
      # Windows' Git Bash finds its own ssh first.
      - name: Check the ssh under test
        shell: pwsh
        run: |
          $ssh = (Get-Command ssh).Source
          $ssh; ssh -V
          if ($ssh -ne $env:SSH_UNDER_TEST) { throw "ssh is $ssh, not $env:SSH_UNDER_TEST" }
      - run: dart test --tags integration --run-skipped
      - name: Show sshd log
        if: failure() && steps.sshd.outputs.log
        shell: bash
        env:
          LOG: ${{ steps.sshd.outputs.log }}
        run: cat "$LOG" 2>/dev/null || sudo cat "$LOG"

  # The one required check, so the matrix can change without touching branch rules.
  ci:
    if: always()
    needs: [analyze, windows-askpass, unit, integration, openssh]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
