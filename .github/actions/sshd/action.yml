name: 'Start sshd'
description: 'An sshd on 127.0.0.1 that accepts a fresh key of the runner user, for the integration tests.'

inputs:
  port:
    description: 'The port sshd listens on.'
    default: '2222'

outputs:
  log:
    description: "sshd's log."
    value: ${{ steps.unix.outputs.log || steps.windows.outputs.log }}

runs:
  using: 'composite'
  steps:
    # Runs as the runner user on a high port, so it needs no root.
    - id: unix
      if: runner.os != 'Windows'
      shell: bash
      env:
        PORT: ${{ inputs.port }}
      run: |
        dir="$RUNNER_TEMP/sshd"
        mkdir -p "$dir" ~/.ssh
        ssh-keygen -q -t ed25519 -N '' -f "$dir/host_key"
        [ -f ~/.ssh/id_ed25519 ] || ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
        cp ~/.ssh/id_ed25519.pub "$dir/authorized_keys"
        options=(-o "Port=$PORT" -o ListenAddress=127.0.0.1 -o "HostKey=$dir/host_key"
          -o "AuthorizedKeysFile=$dir/authorized_keys" -o "PidFile=$dir/sshd.pid"
          -o StrictModes=no -o UsePAM=no)
        # OpenSSH 9.8+ penalises clients that drop before logging in, as some tests do.
        if /usr/sbin/sshd -t -f /dev/null "${options[@]}" -o PerSourcePenalties=no 2>/dev/null; then
          options+=(-o PerSourcePenalties=no)
        fi
        /usr/sbin/sshd -f /dev/null -E "$dir/sshd.log" "${options[@]}"
        echo "log=$dir/sshd.log" >> "$GITHUB_OUTPUT"

    # Windows ships OpenSSH Server as a service; it reads an administrator's keys from ProgramData only.
    - id: windows
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        PORT: ${{ inputs.port }}
      run: |
        $ErrorActionPreference = 'Stop'
        if (-not (Get-Service sshd -ErrorAction SilentlyContinue)) {
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
        }
        Set-Service sshd -StartupType Manual
        # The first start creates the host keys and ProgramData\ssh.
        Start-Service sshd; Stop-Service sshd
        New-Item -ItemType Directory -Force ~/.ssh | Out-Null
        if (-not (Test-Path ~/.ssh/id_ed25519)) { ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519 }
        $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
        Copy-Item ~/.ssh/id_ed25519.pub $keys -Force
        icacls $keys /inheritance:r /grant '*S-1-5-32-544:F' /grant '*S-1-5-18:F' | Out-Null
        $config = "$env:ProgramData\ssh\sshd_config"
        (Get-Content $config) -replace '^#?Port .*', "Port $env:PORT" `
          -replace '^#?ListenAddress 0\.0\.0\.0', 'ListenAddress 127.0.0.1' `
          -replace '^#?SyslogFacility .*', 'SyslogFacility LOCAL0' | Set-Content $config
        Start-Service sshd
        "log=$env:ProgramData\ssh\logs\sshd.log" >> $env:GITHUB_OUTPUT
